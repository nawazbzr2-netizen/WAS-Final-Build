name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack feature source
        run: |
          set -e
          cat scripts/feat_*.b64 | tr -d '\n' | base64 -d > /tmp/src.zip
          unzip -o /tmp/src.zip -d /tmp/src
          cp -a /tmp/src/. .
          test -f app/src/main/java/com/wireless/audiostreamer/audio/MicCapturer.kt
          test -f app/src/main/res/layout/activity_main.xml
          grep -q btnMicSend app/src/main/res/layout/activity_main.xml
          grep -q STREAM_MIC app/src/main/java/com/wireless/audiostreamer/network/Protocol.kt
          echo Feature source OK
          find app/src -type f | wc -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessAudioStreamer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
